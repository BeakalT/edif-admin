name: CI
on:
  pull_request:
  push: { branches: [main] }

permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.23.4'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Types, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings 222   # ratchet: lower this number as `any` types are removed
      - run: npm run test:unit

  security:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Fail on critical advisories in production dependencies
        run: npm audit --omit=dev --audit-level=critical
      - name: Fail on any high advisory that is not on the reviewed allow-list
        run: node scripts/audit-gate.mjs
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration:
    name: Database, API and browser tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: edif, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: edif }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U edif" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://edif:ci-only@localhost:5432/edif
      PAYLOAD_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      SITE_URL: http://localhost:3100
      ALLOW_INSECURE_SITE_URL: 'true'
      ALLOW_OUTBOX: 'true'
      TRUSTED_PROXY_HOPS: '1'
      BASE_URL: http://localhost:3100
      TEST_ENV_FILE: .env.ci
      IMG_DIR: ${{ github.workspace }}/public/images
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Write test environment file
        run: |
          printf 'DATABASE_URL=%s\nPAYLOAD_SECRET=%s\nSITE_URL=%s\nALLOW_INSECURE_SITE_URL=true\nALLOW_OUTBOX=true\nNODE_OPTIONS=--no-deprecation\n' "$DATABASE_URL" "$PAYLOAD_SECRET" "$SITE_URL" > .env.ci
      - name: Apply migrations (the same step production uses)
        run: NODE_ENV=production npx payload migrate
      - name: Seed demo content
        run: for f in seed seed2 seed3 demo-content; do npx payload run scripts/$f.ts; done
      - name: Database-level tests
        run: npm run test:payload
      - name: Build and start the production server
        run: |
          NODE_ENV=production npm run build
          NODE_ENV=production nohup npx next start -p 3100 > server.log 2>&1 &
          npx wait-on -t 90000 http://localhost:3100/readyz
      - name: API end-to-end tests
        run: npm run test:api
      - name: Browser tests (accessibility, security, pages)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics
          path: |
            server.log
            test-results/
            playwright-report/
          if-no-files-found: ignore

  image:
    name: Container image builds and boots
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t edif-web:ci .
      - run: docker build --target migrator -t edif-migrate:ci .
      - name: Image must not contain secrets, databases or backups
        run: |
          docker run --rm --entrypoint sh edif-web:ci -c '! find /app -maxdepth 2 \( -name ".env*" -o -name "*.db" -o -name backups -o -name media \) | grep .'
      - name: Vulnerability scan of the image
        uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: 'edif-web:ci', severity: 'CRITICAL', exit-code: '1', ignore-unfixed: true }
